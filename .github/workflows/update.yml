name: Update data and deploy

on:
  schedule:
    # KST 09:00-16:59, Mon-Fri, every 20 minutes (UTC 00:00-07:59)
    - cron: '*/20 0-7 * * 1-5'
    # KST 17:30-20:30 after-hours session, hourly
    - cron: '30 8-11 * * 1-5'
    # KST 07:15 Tue-Sat, picks up the US close
    - cron: '15 22 * * 1-5'
  push:
    branches: [main]
    paths-ignore: ['data/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch market data
        shell: pwsh
        run: ./scripts/update.ps1
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: update"
          fi
          # Always pick up the newest app files; retry because the app publisher may push at the same moment.
          for i in 1 2 3 4; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              break
            fi
            echo "push attempt $i failed; retrying"
            git rebase --abort 2>/dev/null || true
            sleep 6
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      # The artifact is sometimes not visible to the deploy step right after upload, so wait and retry.
      - run: sleep 20
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 120
      - id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
